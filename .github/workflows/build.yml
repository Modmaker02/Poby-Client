name: Build Poby Client
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q poby-client.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle build --no-daemon
        working-directory: poby-client
      - uses: actions/upload-artifact@v4
        with:
          name: poby-client-jar
          path: |
            poby-client/build/libs/*.jar
            !poby-client/build/libs/*-sources.jar
